[project]
name = "wwm-konghou"
version = "0.1.0"
description = "Turn piano MP3s and scores into Konghou performances in Where Winds Meet"
requires-python = ">=3.12"
dependencies = ["mido>=1.3", "numpy>=1.26", "click>=8.1"]

[project.optional-dependencies]
ml = ["torch", "piano-transcription-inference", "librosa", "soundfile", "audioread"]
omr = ["music21", "pillow", "pymupdf", "homr"]
dev = ["pytest"]

[project.scripts]
wwm = "wwm.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["wwm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
