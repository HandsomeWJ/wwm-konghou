[package]
name = "wwm-play"
version = "0.7.1"
edition = "2021"
authors = ["HandsomeWJ"]
repository = "https://github.com/HandsomeWJ/wwm-konghou"
description = "Plays .wwm.json key scripts into Where Winds Meet"

[lib]
name = "wwm_play"
path = "src/lib.rs"

[[bin]]
name = "wwm-play"
path = "src/bin/wwm-play.rs"

[[bin]]
name = "wwm-konghou"
path = "src/bin/wwm-konghou.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
eframe = "0.31"
egui = "0.31"
rfd = "0.15"

[target.'cfg(windows)'.dependencies]
cpal = "0.16"
hound = "3"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Media",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
egui_kittest = { version = "0.31", features = ["wgpu", "snapshot", "eframe"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
